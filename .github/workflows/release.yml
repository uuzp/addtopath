name: Release Build

on:
  push:
    tags:
      - 'v*.*.*' # Trigger on tags like v1.0.0, v0.2.1 etc.

jobs:
  build:
    permissions:
      contents: write # Needed to create releases and upload assets
    name: Build and Release for Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc # Specify target for clarity, though default on windows-latest
          override: true

      - name: Build release binary
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --target x86_64-pc-windows-msvc
          use-cross: false # Not needed as we are building on the target OS

      - name: Prepare artifact name
        id: prep
        run: |
          $ARTIFACT_NAME="addtopath-windows-${{ github.ref_name }}"
          $ARTIFACT_PATH="./target/x86_64-pc-windows-msvc/release/addtopath.exe"
          $ZIP_PATH="./${ARTIFACT_NAME}.zip"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $env:GITHUB_OUTPUT
          echo "ARTIFACT_PATH=$ARTIFACT_PATH" >> $env:GITHUB_OUTPUT
          echo "ZIP_PATH=$ZIP_PATH" >> $env:GITHUB_OUTPUT
        shell: pwsh # Use PowerShell on Windows runner

      - name: Package executable
        run: Compress-Archive -Path ${{ steps.prep.outputs.ARTIFACT_PATH }} -DestinationPath ${{ steps.prep.outputs.ZIP_PATH }}
        shell: pwsh

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref_name }}
          body: |
            Automated release for ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above
          asset_path: ${{ steps.prep.outputs.ZIP_PATH }}
          asset_name: ${{ steps.prep.outputs.ARTIFACT_NAME }}.zip
          asset_content_type: application/zip